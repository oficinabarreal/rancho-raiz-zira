<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTE Preview — A2UI Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 32px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    border: 1px solid #2a2a4a;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .preview-box {
    background: #0f0f1a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid #2a2a4a;
  }
  .preview-box h3 {
    font-size: 13px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .banner-img {
    width: 100%;
    border-radius: 8px;
    display: block;
  }
  .gif-img {
    width: 100%;
    border-radius: 8px;
    display: block;
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-approve {
    background: #2ecc71;
    color: #fff;
  }
  .btn-approve:hover { background: #27ae60; }
  .btn-reject {
    background: #e74c3c;
    color: #fff;
  }
  .btn-reject:hover { background: #c0392b; }
  .btn:active { transform: scale(0.97); }
  .status-bar {
    margin-top: 16px;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    display: none;
  }
  .status-bar.approved {
    display: block;
    background: rgba(46, 204, 113, 0.15);
    color: #2ecc71;
    border: 1px solid rgba(46, 204, 113, 0.3);
  }
  .status-bar.rejected {
    display: block;
    background: rgba(231, 76, 60, 0.15);
    color: #e74c3c;
    border: 1px solid rgba(231, 76, 60, 0.3);
  }
  .timestamp {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🎨 ARTE Preview</h1>
  <div class="subtitle">Previsualización de contenido — A2UI Demo</div>

  <div class="preview-box">
    <h3>📸 Banner</h3>
    <img class="banner-img" src="simulaciones_output/banner_montanas_124815.png" alt="Banner">
  </div>

  <div class="preview-box">
    <h3>🎬 GIF Animado</h3>
    <img class="gif-img" src="simulaciones_output/anim_montanas_124859.gif" alt="GIF animado">
  </div>

  <div class="actions">
    <button class="btn btn-approve" onclick="handleAction('approved')">✅ Aprobar</button>
    <button class="btn btn-reject" onclick="handleAction('rejected')">❌ Rechazar</button>
  </div>

  <div id="status" class="status-bar">Esperando decisión...</div>
  <div class="timestamp" id="timestamp"></div>
</div>

<script>
function handleAction(action) {
  const status = document.getElementById('status');
  status.className = 'status-bar ' + action;
  status.textContent = action === 'approved'
    ? '✅ Contenido aprobado — procediendo a publicación...'
    : '❌ Contenido rechazado — notificando al creador...';

  document.getElementById('timestamp').textContent =
    'Decisión tomada: ' + new Date().toLocaleString('es-AR');
}
</script>
</body>
</html>
