<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16,185,129,0)"/>
      <stop offset="30%" stop-color="rgba(16,185,129,0.3)"/>
      <stop offset="70%" stop-color="rgba(16,185,129,0.3)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </linearGradient>
    <linearGradient id="z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Subtle stars -->
  <g fill="#fff" opacity="0.15">
    <circle cx="120" cy="100" r="1.5"/>
    <circle cx="300" cy="60" r="1"/>
    <circle cx="500" cy="130" r="1.5"/>
    <circle cx="700" cy="50" r="1"/>
    <circle cx="900" cy="90" r="1.5"/>
    <circle cx="1000" cy="200" r="1"/>
    <circle cx="150" cy="250" r="1"/>
    <circle cx="850" cy="180" r="1.5"/>
    <circle cx="400" cy="200" r="1"/>
    <circle cx="650" cy="160" r="1"/>
    <circle cx="200" cy="350" r="1"/>
    <circle cx="950" cy="300" r="1"/>
    <circle cx="80" cy="180" r="1"/>
    <circle cx="1040" cy="120" r="1.5"/>
  </g>

  <!-- Mountains -->
  <g fill="#1e293b">
    <polygon points="0,1080 160,700 320,850 480,650 640,780 800,620 960,730 1080,680 1080,1080" opacity="0.3"/>
    <polygon points="0,1080 200,800 400,880 600,720 800,850 1000,750 1080,800 1080,1080" opacity="0.15"/>
  </g>

  <!-- Top accent line -->
  <rect width="1080" height="2" fill="url(#accent-line)" y="0"/>

  <!-- Z logo top-left -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
    <text x="40" y="58" font-family="monospace" font-size="52" font-weight="bold" fill="url(#z-grad)" filter="url(#neon)" text-anchor="middle">Z</text>
  </g>

  <!-- Emoji grande -->
    <!-- Rain -->
  <g transform="translate(540, 260)" fill="#60a5fa">
    <circle cx="0" cy="0" r="36" opacity="0.1" fill="#60a5fa"/>
    <path d="M-18,-8 Q-14,-18 -4,-14 Q0,-24 10,-16 Q20,-20 22,-8 Q28,-2 22,6 Z" fill="#93c5fd"/>
    <g stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round">
      <line x1="-14" y1="10" x2="-18" y2="20"/>
      <line x1="-4" y1="12" x2="-8" y2="24"/>
      <line x1="6" y1="10" x2="2" y2="22"/>
      <line x1="14" y1="8" x2="10" y2="18"/>
    </g>
  </g>

  <!-- Círculo decorativo detrás del emoji -->
  <circle cx="540" cy="220" r="100" fill="rgba(16,185,129,0.3)" opacity="0.1" filter="url(#star-glow)"/>

  <!-- Zira phrase -->
    <text x="540" y="332" font-family="system-ui, sans-serif" font-size="36" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">La lluvia es un beso</text>
    <text x="540" y="404" font-family="system-ui, sans-serif" font-size="36" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">del cielo a la tierra.</text>
    <text x="540" y="476" font-family="system-ui, sans-serif" font-size="36" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">Que empiece la magia.</text>


  <!-- Barra decorativa -->
  <rect x="440" y="578" width="200" height="2" rx="1" fill="#10b981" opacity="0.4"/>

  <!-- Footer: Zira + Rancho Raíz -->
  <text x="540" y="628" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="4" opacity="0.8">ZIRA</text>
  <text x="540" y="656" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" letter-spacing="2">RANCHO RAÍZ · BARREAL</text>

  <!-- Badge estilo -->
  <g transform="translate(540, 1020)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.12)" stroke-width="0.5"/>
    <text x="0" y="4" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle" letter-spacing="1">ZEN · ZIRA</text>
  </g>
</svg>