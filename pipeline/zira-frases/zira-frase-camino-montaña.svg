<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16,185,129,0)"/>
      <stop offset="30%" stop-color="rgba(59,130,246,0.3)"/>
      <stop offset="70%" stop-color="rgba(59,130,246,0.3)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </linearGradient>
    <linearGradient id="z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Subtle stars -->
  <g fill="#fff" opacity="0.15">
    <circle cx="120" cy="100" r="1.5"/>
    <circle cx="300" cy="60" r="1"/>
    <circle cx="500" cy="130" r="1.5"/>
    <circle cx="700" cy="50" r="1"/>
    <circle cx="900" cy="90" r="1.5"/>
    <circle cx="1000" cy="200" r="1"/>
    <circle cx="150" cy="250" r="1"/>
    <circle cx="850" cy="180" r="1.5"/>
    <circle cx="400" cy="200" r="1"/>
    <circle cx="650" cy="160" r="1"/>
    <circle cx="200" cy="350" r="1"/>
    <circle cx="950" cy="300" r="1"/>
    <circle cx="80" cy="180" r="1"/>
    <circle cx="1040" cy="120" r="1.5"/>
  </g>

  <!-- Mountains -->
  <g fill="#1e293b">
    <polygon points="0,1080 140,650 280,800 420,600 560,750 700,550 840,700 980,630 1080,720 1080,1080" opacity="0.35"/>
    <polygon points="0,1080 200,780 380,840 560,720 740,800 920,740 1080,780 1080,1080" opacity="0.2"/>
  </g>

  <!-- Top accent line -->
  <rect width="1080" height="2" fill="url(#accent-line)" y="0"/>

  <!-- Z logo top-left -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
    <text x="40" y="58" font-family="monospace" font-size="52" font-weight="bold" fill="url(#z-grad)" filter="url(#neon)" text-anchor="middle">Z</text>
  </g>

  <!-- Emoji grande -->
  <text x="540" y="260" font-family="system-ui, sans-serif" font-size="96" text-anchor="middle">⛰️</text>

  <!-- Círculo decorativo detrás del emoji -->
  <circle cx="540" cy="220" r="100" fill="rgba(59,130,246,0.3)" opacity="0.1" filter="url(#star-glow)"/>

  <!-- Zira phrase -->
    <text x="540" y="296" font-family="system-ui, sans-serif" font-size="44" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">No hay camino fácil</text>
    <text x="540" y="368" font-family="system-ui, sans-serif" font-size="44" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">hasta la cima.</text>
    <text x="540" y="440" font-family="system-ui, sans-serif" font-size="44" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">Pero la vista</text>
    <text x="540" y="512" font-family="system-ui, sans-serif" font-size="44" font-weight="300" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">lo vale todo.</text>


  <!-- Barra decorativa -->
  <rect x="440" y="614" width="200" height="2" rx="1" fill="#3b82f6" opacity="0.4"/>

  <!-- Footer: Zira + Rancho Raíz -->
  <text x="540" y="664" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#3b82f6" text-anchor="middle" letter-spacing="4" opacity="0.8">ZIRA</text>
  <text x="540" y="692" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" letter-spacing="2">RANCHO RAÍZ · BARREAL</text>

  <!-- Badge estilo -->
  <g transform="translate(540, 1020)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.12)" stroke-width="0.5"/>
    <text x="0" y="4" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle" letter-spacing="1">CLASICA · ZIRA</text>
  </g>
</svg>