name: CMS Web Auto-Update

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # manual
  push:
    branches: [main]
    paths:
      - 'scripts/generar_web_cms.py'
      - '.github/workflows/cms-web.yml'
      - 'admin/index.html'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Generate site from CMS
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CRM_STATE_DIR: /tmp/crm_state
        run: |
          mkdir -p /tmp/crm_state
          python3 scripts/generar_web_cms.py

      - name: Commit and push changes
        run: |
          git config user.name "Zira CMS Bot"
          git config user.email "cms@ranchoraiz.bot"
          git add index.html panel/index.html admin/cms_data.json admin/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Web actualizada desde CMS [skip ci]"
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
