name: 📊 Deploy Dashboard
on:
  workflow_run:
    workflows: ["CRM Simulación — Escenarios Automáticos"]
    types: [completed]
  workflow_dispatch:   # manual también

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 Generar Dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generar_dashboard.py

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # assets/zira/ queda incluido automáticamente

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
