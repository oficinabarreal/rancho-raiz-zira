name: Robot Inspector - Simulador de Pruebas
on:
  push:
    branches:
      - main
      - test-automejora-*
  pull_request:
    branches: [ "main" ]

jobs:
  inspect:
    name: Auditoria de Codigo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f hybrid/requirements.txt ]; then
            pip install -r hybrid/requirements.txt
          fi
          echo "Dependencias instaladas correctamente"

      - name: Verificar Sintaxis (compileall)
        run: |
          python -m compileall . \
            -x '__pycache__|\.git|notas|simulaciones_output|\.worktrees|asistente'
          echo "Sintaxis OK - todos los archivos compilan"

      - name: Smoke Test - Modelos CRM
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from crm.models import JourneyStage, Channel, Lead, CustomerProfile, CustomerJourney
          print('✅ Modelos CRM OK')
          print(f'  - JourneyStage: {[e.value for e in JourneyStage]}')
          print(f'  - Channel: {[e.value for e in Channel]}')
          # Crear lead de prueba
          p = CustomerProfile(name='Test', email='test@test.com')
          j = CustomerJourney(source_channel=Channel.TELEGRAM)
          lead = Lead(lead_id='test_001', profile=p, journey=j)
          print(f'  - Lead creado: {lead.lead_id} / {lead.profile.name}')
          "

      - name: Smoke Test - Simulador CRM
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from simulators.crm_simulator import SCENARIOS
          print(f'✅ Simulador OK - {len(SCENARIOS)} escenarios:')
          for s in SCENARIOS:
              print(f'  - {s.id}: {len(s.steps)} pasos')
          "

      - name: Ejecutar Tests Unitarios (Core)
        run: |
          python -m unittest discover -s tests/ -v

      - name: Resumen Final
        run: |
          echo '========================================'
          echo '  ROBOT INSPECTOR - RESULTADO'
          echo '========================================'
          echo '  ✅ Sintaxis: OK'
          echo '  ✅ Imports CRM Core: OK'
          echo '  ✅ Imports Flujo Central: OK'
          echo '  ✅ Escenarios Simulador: Cargados'
          echo '  ✅ Tests: Ejecutados'
          echo '========================================'
          echo '  Rama: ${{ github.ref_name }}'
          echo '  Commit: ${{ github.sha }}'
          echo '  Status: VERDE - Listo para fusion'

  # ─── Tests de Conectividad (solo ramas test-automejora-*) ────────
  connectivity:
    name: Conectividad APIs
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'test-automejora-')
    continue-on-error: true
    environment: hola3-production
    env:
      CRM_TG_TOKEN: ${{ secrets.CRM_TG_TOKEN }}
      CRM_TG_CHAT_ID: ${{ secrets.CRM_TG_CHAT_ID }}
      CRM_INSTAGRAM_TOKEN: ${{ secrets.CRM_INSTAGRAM_TOKEN }}
      CRM_INSTAGRAM_USER_ID: ${{ secrets.CRM_INSTAGRAM_USER_ID }}
      CRM_WHATSAPP_TOKEN: ${{ secrets.CRM_WHATSAPP_TOKEN }}
      CRM_WHATSAPP_PHONE_ID: ${{ secrets.CRM_WHATSAPP_PHONE_ID }}
      CRM_KOMMO_TOKEN: ${{ secrets.CRM_KOMMO_TOKEN }}
      CRM_KOMMO_SUBDOMAIN: ${{ secrets.CRM_KOMMO_SUBDOMAIN }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          echo "Dependencias instaladas"

      - name: Conectividad - Telegram
        run: |
          python -m unittest tests.test_telegram_api -v
        env:
          CRM_TG_TOKEN: ${{ secrets.CRM_TG_TOKEN }}
          CRM_TG_CHAT_ID: ${{ secrets.CRM_TG_CHAT_ID }}

      - name: Conectividad - Google
        run: |
          python -m unittest tests.test_google_api -v
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Conectividad - Instagram / WhatsApp / Kommo
        run: |
          python -m unittest tests.test_social_connectivity -v
        env:
          CRM_INSTAGRAM_TOKEN: ${{ secrets.CRM_INSTAGRAM_TOKEN }}
          CRM_INSTAGRAM_USER_ID: ${{ secrets.CRM_INSTAGRAM_USER_ID }}
          CRM_WHATSAPP_TOKEN: ${{ secrets.CRM_WHATSAPP_TOKEN }}
          CRM_WHATSAPP_PHONE_ID: ${{ secrets.CRM_WHATSAPP_PHONE_ID }}
          CRM_KOMMO_TOKEN: ${{ secrets.CRM_KOMMO_TOKEN }}
          CRM_KOMMO_SUBDOMAIN: ${{ secrets.CRM_KOMMO_SUBDOMAIN }}

      - name: Resumen Conectividad
        run: |
          echo '========================================'
          echo '  CONECTIVIDAD - RESULTADO'
          echo '========================================'
          echo '  Tests de API ejecutados'
          echo '  (errores esperados si tokens no disponibles)'
          echo '========================================'
