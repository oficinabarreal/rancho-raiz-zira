<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16,185,129,0)"/>
      <stop offset="30%" stop-color="rgba(16,185,129,0.15)"/>
      <stop offset="70%" stop-color="rgba(16,185,129,0.15)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </linearGradient>
    <linearGradient id="z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mountains" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-bg">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="1280" y2="40" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1280" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1280" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1280" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Top glow line -->
  <rect width="1280" height="1" fill="url(#glow)" y="0"/>

  <!-- Mountains silhouette -->
  <g fill="url(#mountains)" opacity="0.4">
    <polygon points="0,320 80,220 160,260 240,180 320,240 400,150 480,200 560,170 640,220 720,160 800,210 880,140 960,190 1040,170 1120,230 1200,200 1280,250 1280,320"/>
  </g>
  <g fill="#1e293b" opacity="0.25">
    <polygon points="0,320 120,260 200,280 280,220 360,260 440,190 520,230 600,200 680,250 760,190 840,230 920,180 1000,220 1080,210 1160,260 1280,240 1280,320"/>
  </g>

  <!-- Neural network dots and lines -->
  <g opacity="0.08">
    <circle cx="200" cy="60" r="2" fill="#10b981"/>
    <circle cx="260" cy="100" r="2" fill="#10b981"/>
    <circle cx="230" cy="140" r="2" fill="#10b981"/>
    <line x1="200" y1="60" x2="260" y2="100" stroke="#10b981" stroke-width="0.5"/>
    <line x1="260" y1="100" x2="230" y2="140" stroke="#10b981" stroke-width="0.5"/>
    
    <circle cx="1050" cy="80" r="2" fill="#3b82f6"/>
    <circle cx="1120" cy="120" r="2" fill="#3b82f6"/>
    <circle cx="1080" cy="160" r="2" fill="#3b82f6"/>
    <line x1="1050" y1="80" x2="1120" y2="120" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="1120" y1="120" x2="1080" y2="160" stroke="#3b82f6" stroke-width="0.5"/>
  </g>

  <!-- Z logo -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
    <text x="60" y="88" font-family="monospace" font-size="80" font-weight="bold" fill="url(#z-grad)" filter="url(#neon)" text-anchor="middle">Z</text>
  </g>

  <!-- Texto principal -->
  <text x="270" y="130" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">Zira CRM</text>
  
  <text x="272" y="170" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Rancho Raíz · Barreal, Argentina</text>
  
  <!-- Tags/badges area -->
  <g transform="translate(270, 200)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="rgba(16,185,129,0.12)"/>
    <text x="45" y="16" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">🤖 AI-Powered</text>
    
    <rect x="100" y="0" width="90" height="24" rx="12" fill="rgba(59,130,246,0.12)"/>
    <text x="145" y="16" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">⚡ Autónomo</text>
    
    <rect x="200" y="0" width="100" height="24" rx="12" fill="rgba(139,92,246,0.12)"/>
    <text x="250" y="16" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">📊 Dashboard</text>
  </g>

  <!-- Bottom glow line -->
  <rect width="1280" height="1" fill="url(#glow)" y="319"/>
</svg>
