<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="accent-s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="200" rx="16" fill="url(#bg-s)"/>
  
  <!-- Círculos decorativos suaves -->
  <circle cx="500" cy="40" r="80" fill="rgba(245,158,11,0.05)"/>
  <circle cx="550" cy="160" r="60" fill="rgba(245,158,11,0.04)"/>
  <circle cx="80" cy="180" r="40" fill="rgba(245,158,11,0.03)"/>
  
  <!-- Icono calendario/bell -->
  <g transform="translate(40, 45)">
    <rect x="0" y="8" width="44" height="40" rx="8" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <rect x="6" y="0" width="8" height="14" rx="3" fill="#f59e0b"/>
    <rect x="30" y="0" width="8" height="14" rx="3" fill="#f59e0b"/>
    <text x="22" y="38" font-family="system-ui" font-size="18" fill="#92400e" text-anchor="middle" font-weight="bold">📅</text>
  </g>
  
  <!-- Título -->
  <text x="100" y="72" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#78350f">Recordatorio de Pagos</text>
  
  <!-- Subtítulo -->
  <text x="100" y="100" font-family="system-ui, sans-serif" font-size="13" fill="#92400e">Rancho Raíz · Facturas próximas y pendientes</text>
  
  <!-- Tags suaves -->
  <g transform="translate(100, 125)">
    <rect x="0" y="0" width="80" height="22" rx="10" fill="rgba(245,158,11,0.12)"/>
    <text x="40" y="15" font-family="system-ui" font-size="11" fill="#b45309" text-anchor="middle">🔔 Recordatorio</text>
    
    <rect x="90" y="0" width="70" height="22" rx="10" fill="rgba(16,185,129,0.12)"/>
    <text x="125" y="15" font-family="system-ui" font-size="11" fill="#047857" text-anchor="middle">✅ Sin apuro</text>
    
    <rect x="170" y="0" width="85" height="22" rx="10" fill="rgba(239,68,68,0.12)"/>
    <text x="212" y="15" font-family="system-ui" font-size="11" fill="#b91c1c" text-anchor="middle">⚠️ Requiere atención</text>
  </g>
  
  <!-- Línea sutil inferior -->
  <line x1="40" y1="175" x2="560" y2="175" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  
  <!-- Pie -->
  <text x="300" y="192" font-family="system-ui" font-size="10" fill="#b45309" text-anchor="middle">Zira · Gestión autónoma · Rancho Raíz</text>
</svg>
