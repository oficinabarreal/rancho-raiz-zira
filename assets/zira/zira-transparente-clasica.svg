<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      @keyframes blink-c { 0%,95%,100%{transform:scaleY(1)} 97%{transform:scaleY(0.05)} }
      .eye-c{animation:blink-c 4s ease-in-out infinite;transform-origin:200px 195px}
      @keyframes breathe-c { 0%,100%{transform:scale(1)} 50%{transform:scale(1.006)} }
      .body-c{animation:breathe-c 5s ease-in-out infinite;transform-origin:200px 200px}
      @keyframes sway { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(2deg)} }
      .tree{animation:sway 4s ease-in-out infinite;transform-origin:bottom center}
      .tree:nth-child(2){animation-delay:1.5s}
      @keyframes cloud-move { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }
      .cloud-c{animation:cloud-move 8s ease-in-out infinite}
    </style>
    <linearGradient id="cuerpo-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <linearGradient id="glaciar-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- NUBES -->
  <g class="cloud-c">
    <ellipse cx="90" cy="110" rx="45" ry="16" fill="#fff" opacity="0.35"/>
    <ellipse cx="75" cy="105" rx="25" ry="12" fill="#fff" opacity="0.4"/>
    <ellipse cx="105" cy="105" rx="20" ry="10" fill="#fff" opacity="0.3"/>
  </g>
  <g class="cloud-c" style="animation-delay:4s">
    <ellipse cx="270" cy="140" rx="35" ry="10" fill="#fff" opacity="0.25"/>
  </g>

  <!-- ÁRBOLES PEQUEÑOS -->
  <g class="tree" style="transform-origin:60px 320px">
    <polygon points="60,260 75,300 45,300" fill="#166534" opacity="0.4"/>
    <polygon points="60,270 72,305 48,305" fill="#15803d" opacity="0.5"/>
    <rect x="57" y="300" width="6" height="15" fill="#78350f" opacity="0.4"/>
  </g>
  <g class="tree" style="transform-origin:100px 320px;animation-delay:1.5s">
    <polygon points="100,270 115,310 85,310" fill="#166534" opacity="0.3"/>
    <polygon points="100,280 112,315 88,315" fill="#15803d" opacity="0.4"/>
    <rect x="97" y="310" width="6" height="12" fill="#78350f" opacity="0.3"/>
  </g>

  <!-- PÁJAROS -->
  <g class="cloud-c" style="animation-duration:3s">
    <path d="M 340,70 Q 345,65 350,70" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M 350,70 Q 355,65 360,70" fill="none" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g class="cloud-c" style="animation-duration:3.5s;animation-delay:1.5s">
    <path d="M 320,55 Q 324,51 328,55" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M 328,55 Q 332,51 336,55" fill="none" stroke="#475569" stroke-width="1.5"/>
  </g>

  <g class="body-c">
    <!-- MONTAÑA CUERPO (tonos tierra) -->
    <polygon points="200,85 340,340 60,340" fill="url(#cuerpo-c)"/>
    <!-- VETAS de la montaña -->
    <path d="M 120,200 Q 130,190 140,200" fill="none" stroke="#44403c" stroke-width="1.5" opacity="0.25"/>
    <path d="M 260,220 Q 270,210 280,220" fill="none" stroke="#44403c" stroke-width="1.5" opacity="0.25"/>
    <path d="M 170,155 Q 175,150 180,155" fill="none" stroke="#44403c" stroke-width="1" opacity="0.2"/>
    <path d="M 220,165 Q 225,160 230,165" fill="none" stroke="#44403c" stroke-width="1" opacity="0.2"/>
    <!-- GLACIAR -->
    <path d="M 175,115 Q 200,90 225,115 Q 240,105 235,140 Q 220,145 200,140 Q 180,145 165,138 Q 160,105 175,115 Z" fill="url(#glaciar-c)" opacity="0.95"/>

    <!-- OJOS -->
    <g class="eye-c">
      <ellipse cx="160" cy="195" rx="12" ry="13" fill="#292524"/>
      <ellipse cx="160" cy="195" rx="8" ry="10" fill="#fff"/>
      <circle cx="158" cy="193" r="4" fill="#292524"/>
      <circle cx="156" cy="191" r="1.5" fill="#fff"/>

      <ellipse cx="240" cy="195" rx="12" ry="13" fill="#292524"/>
      <ellipse cx="240" cy="195" rx="8" ry="10" fill="#fff"/>
      <circle cx="238" cy="193" r="4" fill="#292524"/>
      <circle cx="236" cy="191" r="1.5" fill="#fff"/>
    </g>

    <!-- MEJILLAS -->
    <ellipse cx="135" cy="225" rx="9" ry="6" fill="#a8a29e" opacity="0.15"/>
    <ellipse cx="265" cy="225" rx="9" ry="6" fill="#a8a29e" opacity="0.15"/>

    <!-- BOCA -->
    <path d="M 188,232 Q 200,243 212,232" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>

    <!-- BRAZOS -->
    <line x1="80" y1="255" x2="55" y2="275" stroke="#57534e" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="275" x2="40" y2="265" stroke="#57534e" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="255" x2="345" y2="245" stroke="#57534e" stroke-width="5" stroke-linecap="round"/>
    <line x1="345" y1="245" x2="360" y2="235" stroke="#57534e" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
