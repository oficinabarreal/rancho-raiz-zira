<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sunset" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cielo atardecer mágico -->
  <rect width="400" height="400" fill="url(#sunset)"/>

  <!-- Estrellas nacientes (primeras estrellas de la tarde) -->
  <circle cx="80" cy="50" r="1.5" fill="#fef3c7" filter="url(#glow)" opacity="0.8"/>
  <circle cx="320" cy="70" r="2" fill="#fef3c7" filter="url(#glow)" opacity="0.6"/>
  <circle cx="160" cy="30" r="1" fill="#fef3c7" filter="url(#glow)" opacity="0.5"/>
  <circle cx="250" cy="45" r="1.5" fill="#fef3c7" filter="url(#glow)" opacity="0.7"/>

  <!-- Nubes mágicas -->
  <ellipse cx="100" cy="110" rx="50" ry="12" fill="#7c3aed" opacity="0.15"/>
  <ellipse cx="300" cy="130" rx="40" ry="10" fill="#7c3aed" opacity="0.12"/>

  <!-- Montaña morada (mágica) -->
  <polygon points="200,80 340,340 60,340" fill="url(#mountain)" opacity="0.9"/>

  <!-- Brillo en la cima -->
  <circle cx="200" cy="100" r="40" fill="#c084fc" opacity="0.15"/>

  <!-- Glaciar mágico con purpurina -->
  <path d="M 175,110 Q 200,85 225,110 Q 240,100 235,130 
           Q 220,135 200,132 Q 180,135 165,128 
           Q 160,100 175,110 Z" fill="url(#snow)" opacity="0.9"/>
  <circle cx="190" cy="105" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="215" cy="108" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="98" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="205" cy="118" r="1" fill="#fff" opacity="0.4"/>

  <!-- Ojos estrellados ✨ -->
  <!-- Ojo derecho -->
  <ellipse cx="160" cy="195" rx="13" ry="15" fill="#2e1065"/>
  <ellipse cx="160" cy="195" rx="9" ry="11" fill="#fdf4ff"/>
  <circle cx="158" cy="193" r="4" fill="#2e1065"/>
  <circle cx="155" cy="191" r="1.5" fill="#fff"/>
  <!-- Estrella en el ojo -->
  <circle cx="163" cy="191" r="1" fill="#c084fc" opacity="0.6"/>

  <!-- Ojo izquierdo -->
  <ellipse cx="240" cy="195" rx="13" ry="15" fill="#2e1065"/>
  <ellipse cx="240" cy="195" rx="9" ry="11" fill="#fdf4ff"/>
  <circle cx="238" cy="193" r="4" fill="#2e1065"/>
  <circle cx="235" cy="191" r="1.5" fill="#fff"/>
  <!-- Estrella en el ojo -->
  <circle cx="243" cy="191" r="1" fill="#c084fc" opacity="0.6"/>

  <!-- Mejillas (lavanda) -->
  <ellipse cx="135" cy="225" rx="10" ry="7" fill="#c084fc" opacity="0.2"/>
  <ellipse cx="265" cy="225" rx="10" ry="7" fill="#c084fc" opacity="0.2"/>

  <!-- Boca sonrisa pícara -->
  <path d="M 185,232 Q 200,250 215,232" fill="none" stroke="#2e1065" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Brazos estelares -->
  <!-- Brazo izquierdo (apoyado) -->
  <line x1="80" y1="250" x2="55" y2="280" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="55" y1="280" x2="65" y2="295" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- Brazo derecho (lanza estrellas) -->
  <line x1="320" y1="250" x2="345" y2="210" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="345" y1="210" x2="370" y2="195" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <!-- Estrella saliendo de la mano -->
  <polygon points="375,190 378,185 383,184 380,179 384,176 379,177 377,172 374,177 369,176 372,180 368,184 373,185" fill="#fef3c7" filter="url(#glow)"/>

  <!-- Corona de estrellas en la cima -->
  <polygon points="180,90 183,95 188,95 184,99 186,104 180,101 175,104 177,99 173,95 178,95" fill="#fef3c7" opacity="0.8" filter="url(#glow)"/>
  <polygon points="200,82 202,86 206,86 203,89 204,93 200,91 196,93 197,89 194,86 198,86" fill="#fef3c7" opacity="0.9" filter="url(#glow)"/>
  <polygon points="220,90 222,94 226,94 223,97 224,101 220,99 216,101 217,97 214,94 218,94" fill="#fef3c7" opacity="0.8" filter="url(#glow)"/>

  <!-- Corazón flotante -->
  <path d="M 150,300 C 145,295 140,298 140,303 C 140,310 150,316 150,316 C 150,316 160,310 160,303 C 160,298 155,295 150,300 Z" fill="#f9a8d4" opacity="0.4" filter="url(#glow)"/>
</svg>
