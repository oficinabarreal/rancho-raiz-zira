<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      @keyframes sparkle { 0%,100%{opacity:0.2;transform:scale(1)rotate(0deg)} 50%{opacity:1;transform:scale(1.4)rotate(12deg)} }
      .sparkle{animation:sparkle 2.5s ease-in-out infinite}
      .sparkle:nth-child(2){animation-delay:0.6s}
      .sparkle:nth-child(3){animation-delay:1.2s}
      .sparkle:nth-child(4){animation-delay:1.8s}
      @keyframes glow-pulse { 0%,100%{opacity:0.12;transform:scale(1)} 50%{opacity:0.3;transform:scale(1.12)} }
      .glow-pulse{animation:glow-pulse 3s ease-in-out infinite}
      @keyframes float-up { 0%,100%{transform:translateY(0)translateX(0);opacity:0.4} 50%{transform:translateY(-8px)translateX(4px);opacity:0.7} }
      .float-up{animation:float-up 4s ease-in-out infinite}
      .float-up:nth-child(2){animation-delay:2s}
      @keyframes blink { 0%,95%,100%{transform:scaleY(1)} 97%{transform:scaleY(0.05)} }
      .eye-lid{animation:blink 4s ease-in-out infinite;transform-origin:200px 195px}
      @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.006)} }
      .mountain-body{animation:breathe 5s ease-in-out infinite;transform-origin:200px 200px}
      @keyframes star-rotate { 0%,100%{transform:rotate(0deg);opacity:0.7} 50%{transform:rotate(180deg);opacity:1} }
      .star-rotate{animation:star-rotate 4s ease-in-out infinite;transform-origin:200px 100px}
      @keyframes float-heart { 0%,100%{transform:translateY(0)rotate(0deg)} 50%{transform:translateY(-10px)rotate(5deg)} }
      .float-heart{animation:float-heart 3s ease-in-out infinite}
    </style>
    <radialGradient id="sunset" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="magic-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sunset)"/>

  <!-- Estrellas brillando -->
  <circle cx="80" cy="50" r="1.5" fill="#fef3c7" filter="url(#magic-glow)" class="sparkle"/>
  <circle cx="320" cy="70" r="2" fill="#fef3c7" filter="url(#magic-glow)" class="sparkle"/>
  <circle cx="160" cy="30" r="1" fill="#fef3c7" filter="url(#magic-glow)" class="sparkle"/>
  <circle cx="250" cy="45" r="1.5" fill="#fef3c7" filter="url(#magic-glow)" class="sparkle"/>
  <circle cx="55" cy="120" r="1.2" fill="#fef3c7" filter="url(#magic-glow)" class="sparkle"/>
  <circle cx="340" cy="130" r="1" fill="#fef3c7" filter="url(#magic-glow)" class="sparkle"/>

  <!-- Nubes mágicas -->
  <ellipse cx="100" cy="110" rx="50" ry="12" fill="#7c3aed" opacity="0.15"/>
  <ellipse cx="300" cy="130" rx="40" ry="10" fill="#7c3aed" opacity="0.12"/>

  <g class="mountain-body">
    <polygon points="200,80 340,340 60,340" fill="url(#mountain)" opacity="0.9"/>
    <circle cx="200" cy="100" r="40" fill="#c084fc" class="glow-pulse"/>
    <path d="M 175,110 Q 200,85 225,110 Q 240,100 235,130 Q 220,135 200,132 Q 180,135 165,128 Q 160,100 175,110 Z" fill="url(#snow)" opacity="0.9"/>
    <circle cx="190" cy="105" r="2" fill="#fff" opacity="0.6"/>
    <circle cx="215" cy="108" r="2.5" fill="#fff" opacity="0.5"/>
    <circle cx="200" cy="98" r="1.5" fill="#fff" opacity="0.7"/>
    <circle cx="205" cy="118" r="1" fill="#fff" opacity="0.4"/>
  </g>

  <g class="eye-lid">
    <ellipse cx="160" cy="195" rx="13" ry="15" fill="#2e1065"/>
    <ellipse cx="160" cy="195" rx="9" ry="11" fill="#fdf4ff"/>
    <circle cx="158" cy="193" r="4" fill="#2e1065"/>
    <circle cx="155" cy="191" r="1.5" fill="#fff"/>
    <circle cx="163" cy="191" r="1" fill="#c084fc" opacity="0.6"/>
    <ellipse cx="240" cy="195" rx="13" ry="15" fill="#2e1065"/>
    <ellipse cx="240" cy="195" rx="9" ry="11" fill="#fdf4ff"/>
    <circle cx="238" cy="193" r="4" fill="#2e1065"/>
    <circle cx="235" cy="191" r="1.5" fill="#fff"/>
    <circle cx="243" cy="191" r="1" fill="#c084fc" opacity="0.6"/>
  </g>

  <ellipse cx="135" cy="225" rx="10" ry="7" fill="#c084fc" opacity="0.2"/>
  <ellipse cx="265" cy="225" rx="10" ry="7" fill="#c084fc" opacity="0.2"/>
  <path d="M 185,232 Q 200,250 215,232" fill="none" stroke="#2e1065" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="80" y1="250" x2="55" y2="280" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="55" y1="280" x2="65" y2="295" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="250" x2="345" y2="210" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="345" y1="210" x2="370" y2="195" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- Estrella saliendo de la mano -->
  <polygon points="375,190 378,185 383,184 380,179 384,176 379,177 377,172 374,177 369,176 372,180 368,184 373,185" fill="#fef3c7" filter="url(#magic-glow)"/>

  <!-- Corona de estrellas -->
  <g class="star-rotate">
    <polygon points="180,90 183,95 188,95 184,99 186,104 180,101 175,104 177,99 173,95 178,95" fill="#fef3c7" opacity="0.8" filter="url(#magic-glow)"/>
    <polygon points="200,82 202,86 206,86 203,89 204,93 200,91 196,93 197,89 194,86 198,86" fill="#fef3c7" opacity="0.9" filter="url(#magic-glow)"/>
    <polygon points="220,90 222,94 226,94 223,97 224,101 220,99 216,101 217,97 214,94 218,94" fill="#fef3c7" opacity="0.8" filter="url(#magic-glow)"/>
  </g>

  <!-- Corazón flotante -->
  <path d="M 150,300 C 145,295 140,298 140,303 C 140,310 150,316 150,316 C 150,316 160,310 160,303 C 160,298 155,295 150,300 Z" fill="#f9a8d4" opacity="0.4" filter="url(#magic-glow)" class="float-heart"/>
  <path d="M 250,310 C 247,307 244,309 244,312 C 244,316 250,320 250,320 C 250,320 256,316 256,312 C 256,309 253,307 250,310 Z" fill="#f9a8d4" opacity="0.3" filter="url(#magic-glow)" class="float-heart" style="animation-delay:1.5s"/>
</svg>
