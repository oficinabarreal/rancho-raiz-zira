<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      /* 🌟 Estrellas que titilan */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.3); }
      }
      .star { animation: twinkle 3s ease-in-out infinite; }

      /* 👁️ Parpadeo */
      @keyframes blink {
        0%, 95%, 100% { transform: scaleY(1); }
        97% { transform: scaleY(0.05); }
      }
      .eye-lid {
        animation: blink 4s ease-in-out infinite;
        transform-origin: center center;
      }

      /* 🫁 Respiración suave de la montaña */
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.008); }
      }
      .mountain-body { animation: breathe 5s ease-in-out infinite; transform-origin: 200px 200px; }

      /* 👋 Brazo saludando */
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg); }
        75% { transform: rotate(5deg); }
      }
      .arm-wave { animation: wave 2s ease-in-out infinite; transform-origin: 320px 250px; }

      /* ✨ Partículas flotando */
      @keyframes float {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-8px); opacity: 0.7; }
      }
      .particle { animation: float 4s ease-in-out infinite; }
      .particle:nth-child(2) { animation-delay: 1s; }
      .particle:nth-child(3) { animation-delay: 2s; }
      .particle:nth-child(4) { animation-delay: 3s; }

      /* ❄️ Brillitos en glaciar */
      @keyframes shimmer {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .shimmer { animation: shimmer 2.5s ease-in-out infinite; }
      .shimmer:nth-child(2) { animation-delay: 0.5s; }
      .shimmer:nth-child(3) { animation-delay: 1s; }
    </style>

    <!-- Fondo cielo -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Cuerpo montaña -->
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Nieve/glaciar -->
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Brillo -->
    <radialGradient id="glow" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Brillo -->
  <circle cx="200" cy="180" r="120" fill="url(#glow)"/>

  <!-- ESTRELLAS que titilan -->
  <circle cx="100" cy="100" r="2" fill="#f8fafc" class="star"/>
  <circle cx="300" cy="80" r="1.5" fill="#f8fafc" class="star" style="animation-delay: 1s;"/>
  <circle cx="150" cy="50" r="2" fill="#f8fafc" class="star" style="animation-delay: 0.5s;"/>
  <circle cx="280" cy="130" r="1.5" fill="#f8fafc" class="star" style="animation-delay: 2s;"/>
  <circle cx="70" cy="160" r="1.5" fill="#f8fafc" class="star" style="animation-delay: 1.5s;"/>
  <circle cx="330" cy="40" r="1" fill="#f8fafc" class="star" style="animation-delay: 0.8s;"/>
  <circle cx="50" cy="60" r="1" fill="#f8fafc" class="star" style="animation-delay: 2.5s;"/>

  <!-- MONTAÑA con respiración -->
  <g class="mountain-body">
    <!-- Montaña secundaria (atrás) -->
    <polygon points="100,140 280,340 340,340 200,60" fill="#1e293b" opacity="0.4"/>

    <!-- Montaña principal -->
    <polygon points="200,60 340,340 60,340" fill="url(#mountain)" filter="url(#shadow)"/>

    <!-- Glaciar/cabello -->
    <path d="M 170,100 Q 200,70 230,100 Q 250,90 240,130 
             Q 220,140 200,135 Q 180,140 160,130 
             Q 150,90 170,100 Z" fill="url(#snow)" opacity="0.9"/>

    <!-- Brillos en glaciar -->
    <circle cx="185" cy="110" r="3" fill="#f8fafc" class="shimmer"/>
    <circle cx="210" cy="105" r="2.5" fill="#f8fafc" class="shimmer"/>
    <circle cx="195" cy="95" r="2" fill="#f8fafc" class="shimmer"/>
    <circle cx="220" cy="115" r="2" fill="#f8fafc" class="shimmer"/>

    <!-- OJOS con parpadeo -->
    <g class="eye-lid">
      <!-- Ojo derecho -->
      <ellipse cx="160" cy="195" rx="12" ry="14" fill="#1e293b"/>
      <ellipse cx="160" cy="195" rx="8" ry="10" fill="#f8fafc"/>
      <circle cx="158" cy="193" r="4" fill="#1e293b"/>
      <circle cx="156" cy="191" r="1.5" fill="#fff"/>

      <!-- Ojo izquierdo -->
      <ellipse cx="240" cy="195" rx="12" ry="14" fill="#1e293b"/>
      <ellipse cx="240" cy="195" rx="8" ry="10" fill="#f8fafc"/>
      <circle cx="238" cy="193" r="4" fill="#1e293b"/>
      <circle cx="236" cy="191" r="1.5" fill="#fff"/>
    </g>

    <!-- Mejillas -->
    <ellipse cx="135" cy="225" rx="10" ry="6" fill="#ef4444" opacity="0.15"/>
    <ellipse cx="265" cy="225" rx="10" ry="6" fill="#ef4444" opacity="0.15"/>

    <!-- Boca -->
    <path d="M 180,230 Q 200,250 220,230" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Brazo izquierdo (quieto) -->
    <line x1="80" y1="250" x2="55" y2="275" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="275" x2="40" y2="265" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <!-- BRAZO DERECHO (SALUDANDO) con animación -->
    <g class="arm-wave">
      <line x1="320" y1="250" x2="350" y2="220" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <line x1="350" y1="220" x2="365" y2="200" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <!-- "Mano" abierta -->
      <line x1="365" y1="200" x2="360" y2="190" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="365" y1="200" x2="370" y2="190" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="365" y1="200" x2="375" y2="195" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- PARTÍCULAS flotando alrededor -->
  <circle cx="130" cy="260" r="2" fill="#38bdf8" class="particle" opacity="0.3"/>
  <circle cx="270" cy="280" r="1.5" fill="#a78bfa" class="particle" opacity="0.3"/>
  <circle cx="110" cy="300" r="1.5" fill="#34d399" class="particle" opacity="0.2"/>
  <circle cx="290" cy="310" r="1" fill="#fbbf24" class="particle" opacity="0.2"/>

  <!-- Base/suelo -->
  <rect x="40" y="335" width="320" height="8" rx="4" fill="#475569" opacity="0.3"/>
</svg>
