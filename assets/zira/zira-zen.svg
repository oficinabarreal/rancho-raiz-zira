<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      @keyframes zen-breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.005)} }
      .zen-body{animation:zen-breathe 6s ease-in-out infinite;transform-origin:200px 200px}
      @keyframes moon-glow { 0%,100%{opacity:0.9;filter:drop-shadow(0 0 6px #fef3c7)} 50%{opacity:1;filter:drop-shadow(0 0 14px #fef3c7)} }
      .moon{animation:moon-glow 5s ease-in-out infinite}
      @keyframes star-tw { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.8;transform:scale(1.3)} }
      .star-zen{animation:star-tw 4s ease-in-out infinite}
      .star-zen:nth-child(2){animation-delay:0.7s}
      .star-zen:nth-child(3){animation-delay:1.4s}
      .star-zen:nth-child(4){animation-delay:2.1s}
      .star-zen:nth-child(5){animation-delay:2.8s}
      @keyframes lotus-spin { 0%,100%{transform:translate(85,170)scale(0.7)rotate(0deg)} 50%{transform:translate(85,170)scale(0.7)rotate(3deg)} }
      .lotus{animation:lotus-spin 8s ease-in-out infinite;transform-origin:85px 170px}
      @keyframes particle-float { 0%,100%{transform:translateY(0)translateX(0);opacity:0.2} 50%{transform:translateY(-8px)translateX(3px);opacity:0.4} }
      .particle-zen{animation:particle-float 5s ease-in-out infinite}
      .particle-zen:nth-child(2){animation-delay:1s}
      .particle-zen:nth-child(3){animation-delay:2s}
      .particle-zen:nth-child(4){animation-delay:3s}
      @keyframes blink-zen { 0%,98%,100%{transform:scaleY(1)} 99%{transform:scaleY(0.05)} }
      .eye-zen{animation:blink-zen 10s ease-in-out infinite;transform-origin:200px 195px}
    </style>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="luna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="lunar-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#night)"/>

  <!-- Luna llena -->
  <g class="moon">
    <circle cx="300" cy="90" r="28" fill="url(#luna)" filter="url(#lunar-glow)" opacity="0.9"/>
    <circle cx="308" cy="85" r="28" fill="#0f172a" opacity="0.12"/>
  </g>

  <!-- Estrellas titilantes -->
  <circle cx="60" cy="50" r="1.5" fill="#fff" filter="url(#star-glow)" class="star-zen"/>
  <circle cx="130" cy="80" r="1" fill="#fff" filter="url(#star-glow)" class="star-zen"/>
  <circle cx="200" cy="40" r="2" fill="#fff" filter="url(#star-glow)" class="star-zen"/>
  <circle cx="90" cy="130" r="1" fill="#fff" filter="url(#star-glow)" class="star-zen"/>
  <circle cx="40" cy="100" r="1.5" fill="#fff" filter="url(#star-glow)" class="star-zen"/>
  <circle cx="350" cy="140" r="1" fill="#fff" filter="url(#star-glow)" class="star-zen"/>
  <circle cx="250" cy="55" r="1" fill="#fff" filter="url(#star-glow)" class="star-zen"/>

  <!-- Vía Láctea -->
  <path d="M 0,200 Q 100,100 200,150 Q 300,200 400,100" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.06"/>

  <!-- Neblina -->
  <ellipse cx="200" cy="280" rx="150" ry="50" fill="#1e293b" opacity="0.3"/>
  <ellipse cx="200" cy="300" rx="180" ry="40" fill="#1e293b" opacity="0.2"/>

  <g class="zen-body">
    <polygon points="200,100 350,340 50,340" fill="url(#mountain)"/>
    <path d="M 178,125 Q 200,100 222,125 Q 240,115 235,150 Q 220,155 200,150 Q 180,155 165,148 Q 160,115 178,125 Z" fill="url(#snow)" opacity="0.85"/>
  </g>

  <g class="eye-zen">
    <path d="M 148,195 Q 160,185 172,195" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 228,195 Q 240,185 252,195" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M 150,178 Q 160,173 170,178" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 230,178 Q 240,173 250,178" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="140" cy="225" rx="8" ry="5" fill="#64748b" opacity="0.1"/>
  <path d="M 193,235 Q 200,242 207,235" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Brazos meditación -->
  <path d="M 80,260 Q 140,300 180,290" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path d="M 320,260 Q 260,300 220,290" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="295" r="8" fill="#1e293b"/>

  <!-- Loto -->
  <g class="lotus">
    <path d="M 0,10 Q -8,-5 0,-12 Q 8,-5 0,10 Z" fill="#e9d5ff" opacity="0.4"/>
    <path d="M -2,8 Q -12,0 -5,-8 Q -2,-3 -1,5 Z" fill="#d8b4fe" opacity="0.3"/>
    <path d="M 2,8 Q 12,0 5,-8 Q 2,-3 1,5 Z" fill="#d8b4fe" opacity="0.3"/>
  </g>

  <!-- Partículas -->
  <circle cx="140" cy="270" r="1" fill="#fef3c7" filter="url(#star-glow)" class="particle-zen"/>
  <circle cx="260" cy="280" r="1.5" fill="#fef3c7" filter="url(#star-glow)" class="particle-zen"/>
  <circle cx="170" cy="310" r="1" fill="#fef3c7" filter="url(#star-glow)" class="particle-zen"/>
  <circle cx="230" cy="320" r="1" fill="#fef3c7" filter="url(#star-glow)" class="particle-zen"/>
</svg>
