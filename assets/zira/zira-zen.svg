<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="luna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="lunar-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cielo noche profunda -->
  <rect width="400" height="400" fill="url(#night)"/>

  <!-- Luna llena -->
  <circle cx="300" cy="90" r="28" fill="url(#luna)" filter="url(#lunar-glow)" opacity="0.9"/>
  <circle cx="308" cy="85" r="28" fill="#0f172a" opacity="0.12"/>

  <!-- Estrellas -->
  <circle cx="60" cy="50" r="1.5" fill="#fff" filter="url(#star-glow)" opacity="0.7"/>
  <circle cx="130" cy="80" r="1" fill="#fff" filter="url(#star-glow)" opacity="0.5"/>
  <circle cx="200" cy="40" r="2" fill="#fff" filter="url(#star-glow)" opacity="0.8"/>
  <circle cx="90" cy="130" r="1" fill="#fff" filter="url(#star-glow)" opacity="0.4"/>
  <circle cx="40" cy="100" r="1.5" fill="#fff" filter="url(#star-glow)" opacity="0.6"/>
  <circle cx="350" cy="140" r="1" fill="#fff" filter="url(#star-glow)" opacity="0.3"/>
  <circle cx="250" cy="55" r="1" fill="#fff" filter="url(#star-glow)" opacity="0.5"/>

  <!-- Vía Láctea (sutil) -->
  <path d="M 0,200 Q 100,100 200,150 Q 300,200 400,100" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.06"/>

  <!-- Neblina alrededor de la montaña -->
  <ellipse cx="200" cy="280" rx="150" ry="50" fill="#1e293b" opacity="0.3"/>
  <ellipse cx="200" cy="300" rx="180" ry="40" fill="#1e293b" opacity="0.2"/>

  <!-- Montaña -->
  <polygon points="200,100 350,340 50,340" fill="url(#mountain)"/>

  <!-- Capa de nieve/glaciar -->
  <path d="M 178,125 Q 200,100 222,125 Q 240,115 235,150 
           Q 220,155 200,150 Q 180,155 165,148 
           Q 160,115 178,125 Z" fill="url(#snow)" opacity="0.85"/>

  <!-- OJOS CERRADOS - meditación -->
  <path d="M 148,195 Q 160,185 172,195" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 228,195 Q 240,185 252,195" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Cejas serenas -->
  <path d="M 150,178 Q 160,173 170,178" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M 230,178 Q 240,173 250,178" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Mejillas (apenas) -->
  <ellipse cx="140" cy="225" rx="8" ry="5" fill="#64748b" opacity="0.1"/>

  <!-- Sonrisa serena (apenas insinuada) -->
  <path d="M 193,235 Q 200,242 207,235" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Brazos en posición de meditación (cruzados) -->
  <!-- Brazo izquierdo -->
  <path d="M 80,260 Q 140,300 180,290" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Brazo derecho -->
  <path d="M 320,260 Q 260,300 220,290" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

  <!-- Manos juntas (muñecas) -->
  <circle cx="200" cy="295" r="8" fill="#1e293b"/>

  <!-- Loto flotando -->
  <g transform="translate(85, 170) scale(0.7)">
    <path d="M 0,10 Q -8,-5 0,-12 Q 8,-5 0,10 Z" fill="#e9d5ff" opacity="0.4"/>
    <path d="M -2,8 Q -12,0 -5,-8 Q -2,-3 -1,5 Z" fill="#d8b4fe" opacity="0.3"/>
    <path d="M 2,8 Q 12,0 5,-8 Q 2,-3 1,5 Z" fill="#d8b4fe" opacity="0.3"/>
  </g>

  <!-- Partículas de luz flotando -->
  <circle cx="140" cy="270" r="1" fill="#fef3c7" filter="url(#star-glow)" opacity="0.3"/>
  <circle cx="260" cy="280" r="1.5" fill="#fef3c7" filter="url(#star-glow)" opacity="0.25"/>
  <circle cx="170" cy="310" r="1" fill="#fef3c7" filter="url(#star-glow)" opacity="0.2"/>
  <circle cx="230" cy="320" r="1" fill="#fef3c7" filter="url(#star-glow)" opacity="0.2"/>
</svg>
