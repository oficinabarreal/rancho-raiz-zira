<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountain-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="160" fill="url(#sky)"/>

  <!-- Estrellas -->
  <circle cx="50" cy="30" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="45" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="550" cy="35" r="1" fill="#fff" opacity="0.5"/>

  <!-- Montaña principal (Zira) -->
  <polygon points="120,130 200,40 280,130" fill="url(#mountain-grad)"/>

  <!-- Glaciar -->
  <path d="M 185,65 Q 200,40 215,65 Q 220,55 218,75 Q 210,80 200,78 Q 190,80 182,75 Q 180,55 185,65 Z" fill="url(#snow)"/>

  <!-- Ojos Zira -->
  <ellipse cx="185" cy="92" rx="5" ry="6" fill="#0f172a"/>
  <ellipse cx="185" cy="92" rx="3" ry="4" fill="#fff"/>
  <circle cx="184" cy="91" r="1.5" fill="#0f172a"/>

  <ellipse cx="215" cy="92" rx="5" ry="6" fill="#0f172a"/>
  <ellipse cx="215" cy="92" rx="3" ry="4" fill="#fff"/>
  <circle cx="214" cy="91" r="1.5" fill="#0f172a"/>

  <!-- Mejillas -->
  <ellipse cx="175" cy="108" rx="5" ry="3" fill="#ef4444" opacity="0.15"/>
  <ellipse cx="225" cy="108" rx="5" ry="3" fill="#ef4444" opacity="0.15"/>

  <!-- Sonrisa -->
  <path d="M 196,108 Q 200,115 204,108" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Brazo izquierdo (saludando) -->
  <line x1="120" y1="115" x2="100" y2="100" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="88" y2="85" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Brazo derecho -->
  <line x1="280" y1="115" x2="300" y2="120" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Montañas secundarias -->
  <polygon points="0,130 60,70 120,130" fill="#1e293b" opacity="0.5"/>
  <polygon points="280,130 340,80 400,130" fill="#1e293b" opacity="0.5"/>
  <polygon points="400,130 480,90 600,130" fill="#1e293b" opacity="0.3"/>
  <polygon points="500,130 550,100 600,130" fill="#1e293b" opacity="0.2"/>

  <!-- Texto -->
  <text x="400" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#10b981">ZIRA</text>
  <text x="400" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="3">CRM · RANCHO RAÍZ</text>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">🏔️ Hola Leo, acá Zira</text>
</svg>
