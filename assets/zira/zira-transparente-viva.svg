<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      @keyframes blink-v { 0%,94%,100%{transform:scaleY(1)} 96%{transform:scaleY(0.05)} }
      .eye-v{animation:blink-v 3.5s ease-in-out infinite;transform-origin:200px 195px}
      @keyframes breathe-v { 0%,100%{transform:scale(1)} 50%{transform:scale(1.008)} }
      .body-v{animation:breathe-v 5s ease-in-out infinite;transform-origin:200px 200px}
      @keyframes leaf-float { 0%,100%{transform:translate(0,0)rotate(0deg);opacity:0.5} 33%{transform:translate(15px,-18px)rotate(8deg);opacity:0.7} 66%{transform:translate(-5px,-8px)rotate(-5deg);opacity:0.6} }
      .leaf{animation:leaf-float 6s ease-in-out infinite}
      .leaf:nth-child(2){animation-delay:1.5s;animation-duration:7s}
      .leaf:nth-child(3){animation-delay:3s;animation-duration:5s}
      @keyframes flutter-v { 0%,100%{transform:translate(0,0)rotate(0deg)} 25%{transform:translate(3px,-4px)rotate(3deg)} 75%{transform:translate(-2px,-2px)rotate(-2deg)} }
      .flutter-v{animation:flutter-v 3.5s ease-in-out infinite}
      @keyframes arm-wave-v { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(8deg)} }
      .arm-v{animation:arm-wave-v 2.8s ease-in-out infinite;transform-origin:320px 260px}
    </style>
    <linearGradient id="cuerpo-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glaciar-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- HOJAS FLOTANDO -->
  <g class="leaf">
    <path d="M 80,70 Q 90,60 100,70 Q 90,75 80,70 Z" fill="#22c55e" opacity="0.5"/>
    <line x1="80" y1="70" x2="100" y2="70" stroke="#166534" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g class="leaf">
    <path d="M 330,90 Q 340,80 350,90 Q 340,95 330,90 Z" fill="#4ade80" opacity="0.4"/>
    <line x1="330" y1="90" x2="350" y2="90" stroke="#166534" stroke-width="0.5" opacity="0.3"/>
  </g>
  <g class="leaf">
    <path d="M 350,240 Q 360,230 370,240 Q 360,245 350,240 Z" fill="#22c55e" opacity="0.35"/>
    <line x1="350" y1="240" x2="370" y2="240" stroke="#166534" stroke-width="0.5" opacity="0.3"/>
  </g>
  <g class="leaf">
    <path d="M 60,200 Q 70,195 80,200 Q 70,205 60,200 Z" fill="#4ade80" opacity="0.4"/>
    <line x1="60" y1="200" x2="80" y2="200" stroke="#166534" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- MARIPOSA -->
  <g class="flutter-v" style="transform-origin:310px 110px">
    <path d="M 305,110 Q 310,105 315,110 Q 310,112 305,110 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M 315,110 Q 320,105 325,110 Q 320,112 315,110 Z" fill="#f59e0b" opacity="0.6"/>
    <line x1="315" y1="110" x2="315" y2="113" stroke="#78350f" stroke-width="0.8"/>
  </g>

  <g class="body-v">
    <!-- MONTAÑA CUERPO -->
    <polygon points="200,70 340,340 60,340" fill="url(#cuerpo-v)"/>
    <!-- GLACIAR -->
    <path d="M 173,100 Q 200,72 227,100 Q 245,88 238,128 Q 220,138 200,133 Q 180,138 162,128 Q 155,88 173,100 Z" fill="url(#glaciar-v)" opacity="0.9"/>

    <!-- OJOS con parpadeo -->
    <g class="eye-v">
      <ellipse cx="160" cy="195" rx="13" ry="14" fill="#0f172a"/>
      <ellipse cx="160" cy="195" rx="8" ry="10" fill="#f8fafc"/>
      <circle cx="158" cy="193" r="4" fill="#0f172a"/>
      <circle cx="156" cy="191" r="1.5" fill="#fff"/>

      <ellipse cx="240" cy="195" rx="13" ry="14" fill="#0f172a"/>
      <ellipse cx="240" cy="195" rx="8" ry="10" fill="#f8fafc"/>
      <circle cx="238" cy="193" r="4" fill="#0f172a"/>
      <circle cx="236" cy="191" r="1.5" fill="#fff"/>
    </g>

    <!-- CEJAS -->
    <path d="M 145,175 Q 160,169 175,175" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 225,175 Q 240,169 255,175" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- MEJILLAS -->
    <ellipse cx="135" cy="225" rx="10" ry="6" fill="#ef4444" opacity="0.15"/>
    <ellipse cx="265" cy="225" rx="10" ry="6" fill="#ef4444" opacity="0.15"/>

    <!-- BOCA sonrisa amplia -->
    <path d="M 183,232 Q 200,248 217,232" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- FLOR en el cabello (glaciar) -->
    <g style="transform:translate(225px,100px)">
      <circle cx="0" cy="0" r="6" fill="#f472b6" opacity="0.6"/>
      <circle cx="6" cy="-3" r="4" fill="#ec4899" opacity="0.5"/>
      <circle cx="-6" cy="-3" r="4" fill="#ec4899" opacity="0.5"/>
      <circle cx="4" cy="5" r="4" fill="#ec4899" opacity="0.5"/>
      <circle cx="-4" cy="5" r="4" fill="#ec4899" opacity="0.5"/>
      <circle cx="0" cy="0" r="3" fill="#fef3c7"/>
    </g>

    <!-- BRAZOS -->
    <line x1="80" y1="255" x2="55" y2="280" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="280" x2="45" y2="270" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <g class="arm-v">
      <line x1="320" y1="255" x2="350" y2="235" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <line x1="350" y1="235" x2="365" y2="220" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- PAJARITO en el brazo -->
    <g style="transform:translate(340px,230px)scale(0.5)">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#475569"/>
      <circle cx="-6" cy="-4" r="4" fill="#475569"/>
      <circle cx="-8" cy="-5" r="1" fill="#fff"/>
      <circle cx="-8" cy="-5" r="0.5" fill="#000"/>
      <polygon points="-4,0 -2,6 0,0" fill="#fbbf24"/>
      <path d="M 4,2 Q 4,-4 8,0" fill="none" stroke="#475569" stroke-width="1.5"/>
    </g>
  </g>
</svg>
